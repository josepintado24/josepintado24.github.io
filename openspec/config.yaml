# openspec/config.yaml — josepintado24.github.io
# Generated by sdd-init on 2026-09-04.
# Artifact store mode: openspec (replaces prior Engram choice by explicit user authorization).
# Delivery strategy: auto-chain (stacked-to-main). Review budget: 400 lines.

schema: spec-driven

context: |
  Project: josepintado24.github.io — personal GitHub Pages site.
  Tech stack: Astro static site with pnpm; package.json and a lockfile are introduced by
    the approved bootstrap-portfolio change. No application test framework is planned initially.
  Architecture: Astro builds dist/ for the josepintado24.github.io user site. Built-in i18n
    serves explicit /es/ and /en/ routes; GitHub Actions deploys the Pages artifact.
  Testing: None discovered. strict_tdd disabled via no-runner fallback (zero in-scope
    projects, no explicit workspace-level test command).
  Style: Astro components with semantic HTML, hand-rolled CSS, and Web Animations API only.

planning:
  delivery_strategy: auto-chain
  chain_strategy: stacked-to-main
  review_budget_lines: 400

rules:
  proposal:
    - Include rollback plan for any change touching published content, routing, or DNS.
    - State the URL surface affected (e.g. `/`, `/blog/...`) so reviewers can verify on Pages.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Specify content, accessibility (WCAG 2.1 AA baseline), and SEO requirements
      whenever the change touches user-visible markup or page metadata.
  design:
    - Document how any build or deploy change interacts with GitHub Pages serving
      (branch, `gh-pages` vs `main`, custom domain, asset paths).
    - State the content source of truth (file path, generator, or CMS) before
      introducing any new tooling.
  tasks:
    - Group by phase; use hierarchical numbering (e.g. 1, 1.1, 1.1.2).
    - Keep tasks completable in one session.
    - Each task that affects published pages MUST include a live-URL verification step.
  apply:
    guidelines:
      - Preserve existing published pages unless the change explicitly modifies them.
      - Keep file paths stable; renaming published assets is a breaking change.
    tdd: false
    test_command: ""
    build_command: "pnpm build"
    publish_workflow: ".github/workflows/deploy.yml"
  verify:
    test_command: ""
    build_command: "pnpm build"
    coverage_threshold: 0
    manual_checks:
      - Render the affected page(s) at https://josepintado24.github.io before merge.
      - Validate HTML/CSS with at least one linter when the change alters markup.
      - Run `npx html-validate` or equivalent on touched `.html` files when Node is available.
      - Confirm the sitemap and robots outputs reference the canonical user-site URL.
      - Smoke-test reduced-motion behavior and both /es/ and /en/ routes.
      - Confirm repository Pages source is configured as GitHub Actions.
  archive:
    - Warn before merging destructive deltas.
    - Preserve any archived content snapshot under `changes/archive/`.

# Persisted separately from main context per init-details.md.
# Re-evaluate when a project marker (package.json, _config.yml, Gemfile, etc.) appears.
testing:
  strict_tdd: false
  detected: 2026-09-04
  decision_gate: no-runner-fallback
  reason: |
    Zero in-scope project markers discovered (no package.json, pyproject.toml, go.mod,
    Cargo.toml, Gemfile, or _config.yml). No explicit workspace-level test command
    covers an in-scope project, so strict_tdd defaults to false.
    Re-enable only when a project marker appears AND a workspace-level test command
    covers every in-scope project.
  projects: []
  test_layers: []
  coverage: []
  quality_tools: []
